name: CI Quality & Validation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate-and-build:
    name: Lint, Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate static data integrity
        run: npm run validate

      - name: Run unit tests
        run: npm test

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
