<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SUST FES Library - Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // Converts the 404 path into a query parameter on the root index page
      var l = window.location;
      var pathSegmentsToKeep = l.hostname.endsWith('github.io') ? 1 : 0;

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' : '') +
        l.search.slice(1).replace(/&/g, '~and~') +
        l.hash;

      l.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to requested page...</p>
  </body>
</html>
