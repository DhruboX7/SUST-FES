<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SUST FES Library - Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA 404 Fallback Redirect
      // Seamlessly redirects direct deep links into HashRouter routes
      var l = window.location;
      var pathSegmentsToKeep = l.hostname.endsWith('github.io') ? 1 : 0;
      var segments = l.pathname.split('/').filter(Boolean);
      var basePath = (l.hostname.endsWith('github.io') && segments.length > 0) ? '/' + segments[0] : '';
      var subPath = segments.slice(pathSegmentsToKeep).join('/');

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/#/' + subPath + (l.search ? l.search : '') + l.hash;

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to requested page...</p>
  </body>
</html>
