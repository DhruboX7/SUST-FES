    <!-- Protective shim for browser extensions attempting to intercept window.fetch -->
    <script>
      (function() {
        // Prevent extension errors from breaking application runtime
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Ensure window.fetch has both a getter and setter so extensions can safely wrap it
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if property descriptor cannot be redefined
        }
      })();
    </script>
